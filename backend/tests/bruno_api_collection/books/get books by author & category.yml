info:
  name: get books by author & category
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/books?authorId=2&categoryId=1"
  params:
    - name: authorId
      value: "2"
      type: query
    - name: categoryId
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
